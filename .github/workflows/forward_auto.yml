name: 黑嚕嚕 Auto Forward V3.6.29

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；台灣時間 = UTC+8
    # 08:20 Taiwan：OAuth 健康檢查
    - cron: '20 0 * * 1-5'
    # 15:20 Taiwan：正式盤後執行
    - cron: '20 7 * * 1-5'
    # 17:20 Taiwan：第二次重試
    - cron: '20 9 * * 1-5'

permissions:
  contents: read

jobs:
  auto-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Streamlit secrets
        shell: bash
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<EOF
          FUGLE_API_KEY = "${FUGLE_API_KEY}"

          [google_drive_oauth]
          client_id = "${GOOGLE_CLIENT_ID}"
          client_secret = "${GOOGLE_CLIENT_SECRET}"
          refresh_token = "${GOOGLE_REFRESH_TOKEN}"
          token_uri = "https://oauth2.googleapis.com/token"
          folder_name = "黑嚕嚕_Forward帳本"
          state_filename = "V3.6.25.1_forward_state.json"

          [telegram]
          bot_token = "${TELEGRAM_BOT_TOKEN}"
          chat_id = "${TELEGRAM_CHAT_ID}"

          [forward_auto]
          enabled = true
          cutoff_hour = 14
          cutoff_minute = 30
          EOF

      - name: OAuth health check
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,sys
          r=requests.post("https://oauth2.googleapis.com/token",data={
              "client_id":os.environ["GOOGLE_CLIENT_ID"],
              "client_secret":os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token":os.environ["GOOGLE_REFRESH_TOKEN"],
              "grant_type":"refresh_token"},timeout=20)
          if r.status_code==200 and (r.json() or {}).get("access_token"):
              print("OAUTH_HEALTH_OK")
              sys.exit(0)
          msg="🚨 黑嚕嚕｜Google OAuth 失效\nAuto Forward 無法讀寫 Drive，請重新授權並更新 refresh token。"
          try:
              requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  json={"chat_id":os.environ["TELEGRAM_CHAT_ID"],"text":msg},timeout=15)
          except Exception: pass
          print("OAUTH_HEALTH_FAIL",r.status_code,r.text[:300])
          sys.exit(1)
          PY

      - name: Run headless Forward worker
        # 08:20 只做 OAuth 健康檢查；盤後/手動執行才跑正式 Worker。
        shell: bash
        run: |
          HOUR=$(date +%H)
          MIN=$(date +%M)
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] && [ "$HOUR" -lt 14 ]; then
            echo "Morning OAuth health check completed; Forward worker skipped."
            exit 0
          fi
          python forward_worker.py
