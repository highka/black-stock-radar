name: 黑嚕嚕 Auto Forward V3.6.29.2 Taiwan

on:
  workflow_dispatch:
  schedule:
    # V3.6.29.2：排程直接使用台灣時區，不再人工換算 UTC
    - cron: '20 8 * * 1-5'
      timezone: 'Asia/Taipei'   # 08:20 OAuth 健康檢查

    # 盤後多重觸發；Worker 以 Drive last_auto_date 防止重複執行
    - cron: '20 15 * * 1-5'
      timezone: 'Asia/Taipei'   # 15:20 正式盤後執行
    - cron: '50 15 * * 1-5'
      timezone: 'Asia/Taipei'   # 15:50 第一備援
    - cron: '20 16 * * 1-5'
      timezone: 'Asia/Taipei'   # 16:20 第二備援
    - cron: '20 17 * * 1-5'
      timezone: 'Asia/Taipei'   # 17:20 最後備援


permissions:
  contents: read

jobs:
  auto-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Streamlit secrets
        shell: bash
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<EOF
          FUGLE_API_KEY = "${FUGLE_API_KEY}"

          [google_drive_oauth]
          client_id = "${GOOGLE_CLIENT_ID}"
          client_secret = "${GOOGLE_CLIENT_SECRET}"
          refresh_token = "${GOOGLE_REFRESH_TOKEN}"
          token_uri = "https://oauth2.googleapis.com/token"
          folder_name = "黑嚕嚕_Forward帳本"
          state_filename = "V3.6.25.1_forward_state.json"

          [telegram]
          bot_token = "${TELEGRAM_BOT_TOKEN}"
          chat_id = "${TELEGRAM_CHAT_ID}"

          [forward_auto]
          enabled = true
          cutoff_hour = 14
          cutoff_minute = 30
          EOF

      - name: OAuth health check
        shell: bash
        run: |
          python - <<'PY'
          import os,requests,sys
          r=requests.post("https://oauth2.googleapis.com/token",data={
              "client_id":os.environ["GOOGLE_CLIENT_ID"],
              "client_secret":os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token":os.environ["GOOGLE_REFRESH_TOKEN"],
              "grant_type":"refresh_token"},timeout=20)
          if r.status_code==200 and (r.json() or {}).get("access_token"):
              print("OAUTH_HEALTH_OK")
              sys.exit(0)
          msg="🚨 黑嚕嚕｜Google OAuth 失效\nAuto Forward 無法讀寫 Drive，請重新授權並更新 refresh token。"
          try:
              requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  json={"chat_id":os.environ["TELEGRAM_CHAT_ID"],"text":msg},timeout=15)
          except Exception: pass
          print("OAUTH_HEALTH_FAIL",r.status_code,r.text[:300])
          sys.exit(1)
          PY

      - name: Run headless Forward worker
        # 08:20 只做 OAuth 健康檢查；盤後/手動執行才跑正式 Worker。
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          echo "event=$EVENT"
          echo "scheduled_cron=$SCHEDULE"
          echo "runner_taiwan_time=$(date '+%Y-%m-%d %H:%M:%S %Z')"

          # 排程直接指定 Asia/Taipei；即使 GitHub 實際啟動延遲，仍以 github.event.schedule 辨識工作種類。
          # 改用 github.event.schedule 的原始 cron 字串辨識 08:20 OAuth-only 排程。
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "20 8 * * 1-5" ]; then
            echo "MORNING_OAUTH_ONLY_SUCCESS"
            exit 0
          fi

          # 其他 scheduled cron 與 workflow_dispatch 都執行正式 Worker。
          # Worker 會用 Drive last_auto_date 防止重複交易與重複通知。
          python forward_worker.py
